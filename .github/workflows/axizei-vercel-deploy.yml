name: Deploy AXIZEI to Vercel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/axizei-vercel-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install

      - name: Build verification
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link or create Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN secret is missing" && exit 2)
          vercel link --yes --project axizei-proof-commerce --scope vassilis-projects-3bf8541b --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prod --yes --scope vassilis-projects-3bf8541b --token "$VERCEL_TOKEN"
